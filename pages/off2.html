<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>差假證明產生器</title>
  
  <!-- 引入共用與專屬 CSS -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/tools/officialleave.css">
  <!-- 引入 html2canvas 供 PNG 輸出 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    /* 新增功能的內嵌輔助樣式（不影響原版版面設計） */
    .seal-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #b71c1c;
      outline: 1.5px solid #b71c1c;
      outline-offset: 2.5px;
      color: #b71c1c;
      padding: 4px 10px;
      line-height: 1.25;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 3px;
      box-shadow: 0 0 1px rgba(183, 28, 28, 0.4);
      user-select: none;
      font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", serif;
    }
    .seal-box .dept-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      margin-right: 6px;
      border-right: 1px dashed rgba(183,28,28,0.4);
      padding-right: 4px;
    }
    .seal-box .name {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      writing-mode: vertical-rl;
      text-orientation: upright;
    }
    /* 台灣地圖 Modal */
    .tw-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .tw-modal-content {
      background: #fff;
      border-radius: 12px;
      width: 90%;
      max-width: 520px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .tw-city-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 15px;
      max-height: 280px;
      overflow-y: auto;
    }
    .tw-city-btn {
      padding: 8px 4px;
      font-size: 13px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f8fafc;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .tw-city-btn:hover {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
  </style>
</head>
<body>

<!-- 手機頂部 Header -->
<div class="mobile-header" id="mobileHeader">
  <span>📋 差假證明產生器</span>
  <button class="hamburger" onclick="togglePanel()" aria-label="開啟設定">
    <span></span><span></span><span></span>
  </button>
</div>

<div class="overlay" id="overlay" onclick="togglePanel()"></div>

<!-- 左側面板 -->
<div class="panel" id="panel">
  <h1>📋 差假證明產生器</h1>

  <!-- 印章自訂與蓋印設定 -->
  <div>
    <div class="section-title">印章設定</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="sealEnable" checked>
        <label for="sealEnable" style="font-weight:600;cursor:pointer;">自動加蓋印章</label>
      </div>
      <div class="form-group">
        <label>印章職稱 (左側)</label>
        <input type="text" id="sealTitle" value="電機工程系 助理教授">
      </div>
      <div class="form-group">
        <label>印章姓名 (右側)</label>
        <input type="text" id="sealName" value="陳靜茹">
      </div>
    </div>
  </div>

  <div>
    <div class="section-title">計畫資訊</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <!-- 計畫名稱下拉選單 -->
      <div class="form-group">
        <label>選擇計畫名稱</label>
        <select id="projectPreset" onchange="applyProjectPreset()">
          <option value="114-851|智慧無人機暨影像辨識研究計畫">國科會 - 智慧無人機暨影像辨識 (114-851)</option>
          <option value="114-EDU-01|高等教育深耕計畫第二期">高教深耕 - 高等教育深耕計畫第二期 (114-EDU-01)</option>
          <option value="113-IND-09|智慧感測產學合作研發案">產學合作 - 智慧感測研發案 (113-IND-09)</option>
          <option value="custom">自訂計畫名稱...</option>
        </select>
      </div>
      <div class="form-group">
        <label>計畫名稱</label>
        <input type="text" id="projectName" value="智慧無人機暨影像辨識研究計畫" placeholder="例：智慧無人機暨影像辨識研究計畫">
      </div>
      <div class="form-group">
        <label>計畫編號</label>
        <input type="text" id="projectNo" value="114-851" placeholder="例：114-851">
      </div>
      <div class="form-group">
        <label>出差地點</label>
        <div style="display:flex;gap:6px;">
          <input type="text" id="location" value="嘉義縣" placeholder="例：嘉義縣" style="flex:1;">
          <button type="button" class="btn-sm" style="white-space:nowrap;padding:0 10px;cursor:pointer;" onclick="openTaiwanMap()">🗺️ 地圖選取</button>
        </div>
      </div>
      <div class="form-group">
        <label>任務說明</label>
        <input type="text" id="task" value="現地勘查" placeholder="例：現地勘查、協助感測器安裝">
      </div>
    </div>
  </div>

  <div>
    <div class="section-title">日期 &amp; 時間</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div class="form-group">
        <label>出差日期</label>
        <input type="date" id="tripDate" value="2026-03-24">
      </div>
      <div class="time-row">
        <!-- 時間下拉選單 -->
        <div class="form-group">
          <label>開始時間</label>
          <select id="timeStart">
            <!-- 由 JS 自動填入每半小時一階 -->
          </select>
        </div>
        <div class="form-group">
          <label>結束時間</label>
          <select id="timeEnd">
            <!-- 由 JS 自動填入每半小時一階 -->
          </select>
        </div>
      </div>
    </div>
  </div>

  <div>
    <div class="section-title">出差人員</div>
    <div class="select-all-row">
      <button class="btn-sm btn-select-all" onclick="selectAll(true)">全選</button>
      <button class="btn-sm btn-deselect" onclick="selectAll(false)">全不選</button>
    </div>
    <div class="member-grid" id="memberGrid"></div>
  </div>

  <button class="btn-generate" onclick="generate()">🖨️ 產生差假證明</button>
  <button class="btn-individual" onclick="generateIndividual()">📝 產生個人出差文字</button>
</div>

<!-- 右側預覽區 -->
<div class="preview-area">
  <div class="preview-toolbar" id="toolbar">
    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab" id="tabCert" onclick="switchMode('cert')">📄 證明書</button>
      <button class="mode-tab" id="tabIndividual" onclick="switchMode('individual')">📝 個人文字</button>
    </div>
    <button class="btn-print" id="btnPrint" onclick="window.print()">🖨️ 列印 / 存成 PDF</button>
    <!-- 新增匯出 PNG 按鈕 -->
    <button class="btn-print" id="btnExportPng" onclick="exportToPng()" style="background-color:#059669;margin-left:6px;">🖼️ 輸出 PNG</button>
    <button class="btn-copy-all" id="btnCopyAll" onclick="copyAll()" style="display:none;">📋 複製全部文字</button>
    
    <div class="zoom-controls" id="zoomControls">
      <button class="zoom-btn" onclick="changeZoom(-10)">−</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="zoom-btn" onclick="changeZoom(10)">＋</button>
      <button class="zoom-btn" onclick="resetZoom()" title="重設縮放" style="font-size:13px;">↺</button>
    </div>
  </div>

  <div class="a4-wrapper" id="a4Wrapper">
    <div id="previewContent">
      <div class="placeholder">⬅️ 填寫左側資訊後<br>點擊下方按鈕產生內容</div>
    </div>
  </div>
</div>

<!-- 台灣縣市選擇視窗 (Modal) -->
<div class="tw-modal" id="twMapModal" onclick="closeTaiwanMap(event)">
  <div class="tw-modal-content" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:8px;">
      <h3 style="margin:0;font-size:16px;">🗺️ 選擇出差地點（縣市）</h3>
      <button type="button" onclick="closeTaiwanMap()" style="border:none;background:none;font-size:18px;cursor:pointer;">✕</button>
    </div>
    <div class="tw-city-grid" id="cityList"></div>
  </div>
</div>

<!-- 引入獨立的 JavaScript -->
<script src="../js/tools/officialleave.js" defer></script>

</body>
</html>
